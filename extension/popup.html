<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 280px;
            font-family: sans-serif;
            font-size: 13px;
            padding: 12px;
            background: #fff;
            color: #000;
        }

        h1 {
            font-size: 14px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 3px;
        }

        input, select, button {
            width: 100%;
            display: block;
            margin-bottom: 10px;
            padding: 6px 8px;
            font-size: 13px;
            font-family: sans-serif;
            border: 1px solid #999;
            background: #fff;
            color: #000;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 6px;
            font-size: 12px;
            display: none;
        }

        #status.show { display: block; }

        p.hint {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
            border-top: 1px solid #ccc;
            padding-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Auto Answer</h1>

    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="AIza..." />

    <label for="model">Model</label>
    <select id="model">
        <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
    </select>

    <button id="scanBtn">Scan &amp; Answer</button>

    <div id="status"></div>

    <p class="hint">Open any quiz page, then click "Scan &amp; Answer" to auto-fill answers.</p>

    <script src="popup.js"></script>
</body>
</html>
